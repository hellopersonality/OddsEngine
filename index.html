<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Odds Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: loud neo-brutalist toy; blunt, flat, chunky, every press a little party
   IDEA: a tabletop chance machine on a printed card - coins and dice on a slab
   PICTURE: the tray itself, full screen; coins and dice with thick outlines and hard shadows
   COLOUR and TYPE: near-black ground, charcoal slabs, off-white lines, bright cycling accents (light skin optional); Archivo Black + Space Grotesk
   LAYOUT: score, level and XP bar top, tray centre, big press button at the thumb, level-up cards as a slab overlay */
:root{color-scheme:dark;--bg:#121216;--ink:#f2eee6;--surf:#24242d;--edge:#f2eee6;--hard:#f2eee6;--line:#0b0b0f;--accent:#ff5ca8;--muted:#a9a9b8;--off:#2e2e38;--pal:#ffe14d;--pal2:#4cc9f0;--pink:#ff5ca8;--yellow:#ffe14d}
:root[data-skin=light]{color-scheme:light;--bg:#a5d8ff;--ink:#111;--surf:#fff;--edge:#111;--hard:#111;--line:#111;--accent:#111;--muted:#444;--off:#e9e9e9}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.35 "Space Grotesk",system-ui,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:var(--ink)}
.slab{border:3px solid var(--edge);border-radius:10px;box-shadow:5px 5px 0 var(--hard);background:var(--surf);color:var(--ink)}
.bright{border-color:var(--line);color:#111}
#ui{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;padding:8px max(14px,env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom))}
#probe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
@media(max-width:420px){#pouchBtn,.tog{min-height:34px;padding:5px 10px;font-size:12px}}
#upd{position:fixed;left:50%;top:calc(58px + env(safe-area-inset-top));z-index:8;display:none;align-items:center;gap:10px;padding:8px 8px 8px 14px;translate:-50% 0;font-weight:700;font-size:14px;white-space:nowrap;box-shadow:5px 5px 0 var(--accent);animation:slam .4s cubic-bezier(.2,1.7,.4,1)}
#upd.open{display:flex}#upd button{min-height:36px;padding:4px 12px;font-weight:700;cursor:pointer;box-shadow:2px 2px 0 var(--hard)}
#updGo{background:var(--yellow)}
#go{width:100%;height:clamp(60px,10svh,80px);font:clamp(28px,8.6vw,38px)/1 "Archivo Black",Impact,sans-serif;letter-spacing:.02em;background:var(--yellow);cursor:pointer;transition:translate .32s cubic-bezier(.3,1.5,.5,1),opacity .18s,transform .05s,box-shadow .05s}
#go:active,#go.down{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--hard)}
#go.hit{animation:hit .2s}
#go{display:grid;place-content:center;gap:4px}
#go small{font:700 13px/1 "Space Grotesk",sans-serif;letter-spacing:0}
#go.last{background:#ff4b3e}
#swap{width:100%;display:grid;gap:14px;justify-items:center}#swap[hidden]{display:none}
#cards[hidden],#reroll[hidden]{display:none}
#swapRow{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.sw{display:grid;justify-items:center;gap:4px;padding:10px 12px 8px;cursor:pointer;font-weight:700}
.sw canvas{position:static;width:56px;height:56px}
.sw:active{translate:4px 4px;box-shadow:1px 1px 0 var(--hard)}
#swapBack{min-height:44px;padding:8px 18px;font-weight:700;cursor:pointer}
#over .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:520px}
#over .stat{padding:12px;text-align:center}#over .stat b{display:block;font:30px/1.1 "Archivo Black",sans-serif}#over .stat span{font-size:13px;font-weight:700;color:var(--muted)}
#again{min-height:64px;padding:10px 34px;font:28px/1 "Archivo Black",sans-serif;background:var(--yellow);cursor:pointer}
#again:active{translate:4px 4px;box-shadow:1px 1px 0 var(--hard)}
#go.wait{translate:0 170%;opacity:0;pointer-events:none}
#go.ready{animation:ready .35s cubic-bezier(.2,1.8,.4,1)}
@keyframes ready{40%{scale:1.05 1.1}}
@keyframes hit{35%{scale:1.03 .92}70%{scale:.99 1.04}}
:focus-visible{outline:3px dashed var(--ink);outline-offset:4px}
#pouchBtn{position:fixed;top:calc(10px + env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));z-index:3;min-height:38px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:3px 3px 0 var(--hard)}
#pouchBtn.bump{animation:hit .3s}
#pouchDlg{position:fixed;inset:0;z-index:6;display:none;place-items:center;padding:14px;background:rgba(10,10,12,.8)}#pouchDlg.open{display:grid}
#pouchBox{width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:18px;display:grid;gap:12px;box-shadow:8px 8px 0 var(--accent)}
#pouchBox h2{margin:0;font:28px/1 "Archivo Black",sans-serif}#pouchBox .note{margin:0;color:var(--muted);font-size:14px}
.prow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 10px}
.prow canvas{position:static;width:44px;height:44px}.prow b{display:block;font:16px/1.15 "Archivo Black",sans-serif}.prow small{color:var(--muted);font-size:14px}
.prow .n{font:22px/1 "Archivo Black",sans-serif}
#opt{position:fixed;top:calc(10px + env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));display:grid;justify-items:end;gap:8px;z-index:3}
.tog{min-height:38px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:3px 3px 0 var(--hard)}
.tog[aria-pressed=false]{opacity:.55}
#panel{display:none;gap:8px;justify-items:end}#panel.open{display:grid}
#lvl,#over{position:fixed;inset:0;z-index:5;display:none;place-items:center;padding:14px;background:rgba(10,10,12,.62);overflow:auto}
#lvl.open,#over.open{display:grid}
#lvBox,#ovBox{width:100%;max-width:760px;display:grid;gap:14px;justify-items:center}
#lvBox h2,#ovBox h2{text-align:center;margin:0;font:clamp(40px,11vw,64px)/1 "Archivo Black",Impact,sans-serif;color:var(--pal);-webkit-text-stroke:3px #0b0b0f;paint-order:stroke fill;text-shadow:5px 5px 0 var(--pal2);animation:slam .45s cubic-bezier(.2,1.7,.4,1)}
@keyframes slam{from{transform:scale(2.2) rotate(-8deg);opacity:0}}
.sub{margin:-6px 0 0;font-weight:700;color:#f2eee6}
#cards{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{position:relative;display:grid;grid-template-rows:auto auto auto 1fr;justify-items:center;text-align:center;gap:8px;padding:0 12px 14px;overflow:hidden;cursor:pointer;opacity:0;animation:flipIn .38s cubic-bezier(.2,1.5,.4,1) forwards;transition:translate .06s,box-shadow .06s}
.card:hover{translate:0 -4px}
.card:active{translate:4px 4px;box-shadow:1px 1px 0 var(--hard)}
@keyframes flipIn{from{opacity:0;transform:perspective(600px) rotateY(95deg) scale(.8)}to{opacity:1;transform:none}}
.card .band{width:calc(100% + 24px);padding:5px;font:13px/1.2 "Archivo Black",sans-serif;color:#111;border-bottom:3px solid var(--edge)}
.card.r0 .band{background:#4cc9f0}.card.r1 .band{background:#c39bff}.card.r2 .band{background:var(--pal)}
.card.r2{box-shadow:5px 5px 0 var(--pal),0 0 0 3px var(--pal2)}
.card canvas{position:static;width:64px;height:64px}
.card b{font:19px/1.1 "Archivo Black",sans-serif}
.card small{font-size:14px;line-height:1.3;color:var(--muted)}
.card .lv{position:absolute;top:36px;right:8px;padding:2px 7px;border:2px solid var(--line);border-radius:6px;background:var(--pink);color:#111;font:12px/1.3 "Archivo Black",sans-serif}
#reroll{min-height:44px;padding:8px 18px;font-weight:700;cursor:pointer}
#reroll:disabled{opacity:.4;cursor:default}
@media(max-width:560px){#cards{grid-template-columns:minmax(0,1fr)}.card{grid-template-columns:56px minmax(0,1fr);grid-template-rows:auto auto;text-align:left;justify-items:start;column-gap:12px;row-gap:2px;padding:0 12px 12px}
  .card .band{grid-column:1/-1;margin-bottom:6px;text-align:center}.card canvas{grid-row:2/4;width:56px;height:56px;align-self:center}.card small{grid-column:2}.card .lv{top:auto;bottom:10px}
  #go{height:72px;font-size:34px}}
#pouchClose{width:44px;height:44px;font:22px/1 "Archivo Black",sans-serif;cursor:pointer;box-shadow:3px 3px 0 var(--hard)}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px}
/* ---- ambient motion: slow, small, always on (off for reduced motion or with Juice off) ---- */
@keyframes breathe{0%,100%{box-shadow:5px 5px 0 var(--hard);rotate:0deg}50%{box-shadow:7px 7px 0 var(--hard);rotate:-.35deg}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -2px}}
@keyframes sway{0%,100%{rotate:-1.2deg}50%{rotate:1.2deg}}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -4px}}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.amb #go:not(.ready):not(.hit):not(.wait):not(.down){animation:breathe 3.6s ease-in-out infinite}
.amb #pouchBtn:not(.bump){animation:bob 5.2s ease-in-out infinite}
.amb #optBtn{animation:bob 6.1s ease-in-out -2s infinite}
.amb #lvBox h2,.amb #ovBox h2{animation:slam .45s cubic-bezier(.2,1.7,.4,1),sway 3.4s ease-in-out .45s infinite}
.amb .card.idle{animation:none;opacity:1;animation:float 3.2s ease-in-out infinite;animation-delay:var(--fd)}
.amb .card.r2 .band{background:linear-gradient(100deg,var(--pal) 38%,#fff9 50%,var(--pal) 62%);background-size:250% 100%;animation:shine 2.6s linear infinite}
.amb #again{animation:breathe 3s ease-in-out infinite}
.amb .prow:nth-child(odd){animation:bob 4.6s ease-in-out infinite}.amb .prow:nth-child(even){animation:bob 4.6s ease-in-out -2.3s infinite}
</style>
</head>
<body>
<canvas id="cv" aria-label="Coin and dice tray"></canvas>
<div id="probe"></div>
<div id="upd" class="slab" role="status"><span>New version ready</span><button id="updGo" class="slab bright">Update</button><button id="updLater" class="slab" aria-label="Dismiss">Later</button></div>
<div id="opt">
  <button class="tog slab" id="optBtn" aria-expanded="false">Options</button>
  <div id="panel">
    <button class="tog slab" id="tJuice" aria-pressed="true">Juice</button>
    <button class="tog slab" id="tSlow" aria-pressed="false">Slow-mo</button>
    <button class="tog slab" id="tSound" aria-pressed="true">Sound</button>
    <button class="tog slab" id="tSkin" aria-pressed="false">Light mode</button>
    <button class="tog slab" id="tReset">Reset save</button>
  </div>
</div>
<button id="pouchBtn" class="slab" aria-haspopup="dialog">Pouch</button>
<div id="pouchDlg" role="dialog" aria-modal="true" aria-labelledby="pouchTitle"><div id="pouchBox" class="slab">
  <div class="head"><h2 id="pouchTitle">COIN POUCH</h2><button id="pouchClose" class="slab" aria-label="Close pouch">×</button></div>
  <p class="note">Your dice decide how many coins flip. Every special coin you own plays in every press, at a random spot; plain coins fill the rest.</p>
  <div id="pouchList" style="display:grid;gap:10px"></div>
</div></div>
<div id="ui"><button id="go" class="slab bright"><span id="goLbl">FLIP</span><small id="goLeft"></small></button></div>
<div id="lvl" role="dialog" aria-modal="true" aria-labelledby="lvTitle">
  <div id="lvBox">
    <h2 id="lvTitle">LEVEL 2</h2>
    <p class="sub">Pick one</p>
    <div id="cards"></div>
    <button id="reroll" class="slab">Reroll</button>
    <div id="swap" hidden><div id="swapRow"></div><button id="swapBack" class="slab">Back to cards</button></div>
  </div>
</div>
<div id="over" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
  <div id="ovBox">
    <h2 id="ovTitle">OUT OF PRESSES</h2>
    <p class="sub" id="ovSub">The machine stopped at level 1</p>
    <div class="stats">
      <div class="stat slab"><b id="stLv">1</b><span>Level reached</span></div>
      <div class="stat slab"><b id="stBest">0</b><span>Best press</span></div>
      <div class="stat slab"><b id="stRecord">1</b><span>Best run (level)</span></div>
    </div>
    <button id="again" class="slab bright">NEW RUN</button>
  </div>
</div>
<script>
{
// ================= juice (CloverPit-style springs, inlined) =================
const PALETTE=['#ff5ca8','#ff4b3e','#ff9f1c','#ffe14d','#3ddc97','#4cc9f0','#4361ee','#9b5de5'];
const cfg={shadow:true,cycle:true,punch:true,shake:true,timeScale:1,lag:.5,offset:7,layers:1,cycleHz:8};
const spring=(x,t=x,k=400,z=.4)=>({x,v:0,t,k,z});
function stepSpring(s,dt){const c=2*s.z*Math.sqrt(s.k);s.v+=(-s.k*(s.x-s.t)-c*s.v)*dt;s.x+=s.v*dt}
const lagK=()=>900-840*cfg.lag;
const cycleIndex=(now=performance.now())=>cfg.cycle?Math.floor(now/1000*cfg.cycleHz)%8:3;
const pal=i=>PALETTE[((i%8)+8)%8];
class Juicy{
  constructor(x,y,o={}){
    this.p={x:spring(x,x,o.k??500,o.z??.35),y:spring(y,y,o.k??500,o.z??.35)};
    this.s=spring(o.from??1,1,o.sk??420,o.sz??.3);this.r=spring(0,0,300,.3);
    this.kick={x:spring(0,0,260,.4),y:spring(0,0,260,.4)};
    this.sh=[0,1,2].map(()=>({x:spring(x),y:spring(y),s:spring(o.from??1)}));
    this.ci=o.ci??0;this.highlight=0;
  }
  moveTo(x,y){this.p.x.t=x;this.p.y.t=y;return this}
  snap(x,y){for(const s of[this.p.x,...this.sh.map(h=>h.x)]){s.x=s.t=x;s.v=0}for(const s of[this.p.y,...this.sh.map(h=>h.y)]){s.x=s.t=y;s.v=0}return this}
  punch(v=10){if(cfg.punch)this.s.v+=v;return this}
  wobble(a=.35){if(cfg.punch)this.r.x=(Math.random()<.5?-1:1)*a;return this}
  shove(f=260){if(!cfg.punch)return this;const a=Math.random()*6.283;this.kick.x.v+=Math.cos(a)*f;this.kick.y.v+=Math.sin(a)*f;return this}
  pop(){this.s.x=0;this.s.t=1;return this.punch(6).wobble()}
  hide(){this.s.t=0;this.s.k=600;this.s.z=.9;return this}
  get motion(){const h=this.sh[0];return Math.min(1,(Math.abs(this.p.x.x-h.x.x)+Math.abs(this.p.y.x-h.y.x))/14+Math.abs(this.p.x.v)/900+Math.abs(this.p.y.v)/900)}
  update(dt){
    for(const s of[this.p.x,this.p.y,this.s,this.r,this.kick.x,this.kick.y])stepSpring(s,dt);
    this.sh.forEach((h,j)=>{const k=lagK()*Math.pow(.6,j);h.x.k=h.y.k=h.s.k=k;h.x.z=h.y.z=h.s.z=.55;
      h.x.t=this.p.x.x;h.y.t=this.p.y.x;h.s.t=this.s.x;stepSpring(h.x,dt);stepSpring(h.y,dt);stepSpring(h.s,dt)});
  }
  shadowXf(j,base=cfg.offset){const h=this.sh[j],o=base*(j+1);
    return{x:h.x.x+o+this.kick.x.x*(j+1)*.06,y:h.y.x+o+this.kick.y.x*(j+1)*.06,s:Math.max(0,h.s.x),r:this.r.x*.7}}
  xf(){return{x:this.p.x.x,y:this.p.y.x,s:Math.max(0,this.s.x),r:this.r.x}}
}
// neo-brutalist sticker: colour fill + thick black outline; lagging shadow copies in palette colours, also outlined
function drawSticker(ctx,j,text,size,font='"Archivo Black", Impact, sans-serif'){
  const step=cycleIndex()+j.ci;
  ctx.font=`${size}px ${font}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
  if(cfg.shadow)for(let L=Math.min(cfg.layers,3)-1;L>=0;L--){const t=j.shadowXf(L,cfg.offset*size/44);
    ctx.save();ctx.translate(t.x,t.y);ctx.rotate(t.r);ctx.scale(t.s,t.s);ctx.lineWidth=size*.24;ctx.strokeStyle='#111';ctx.strokeText(text,0,0);ctx.fillStyle=pal(step+5+L*2);ctx.fillText(text,0,0);ctx.restore()}
  const t=j.xf();ctx.save();ctx.translate(t.x,t.y);ctx.rotate(t.r);ctx.scale(t.s,t.s);
  ctx.lineWidth=size*.24;ctx.strokeStyle='#111';ctx.strokeText(text,0,0);ctx.fillStyle=pal(step+2);ctx.fillText(text,0,0);ctx.restore();
}
class JuiceWorld{
  constructor(){this.pops=[];this.coins=[];this.trauma=0;this.items=new Set()}
  add(j){this.items.add(j);return j}
  popText(text,x,y,o={}){const j=new Juicy(x,y+10,{from:0,sk:o.k??380,ci:o.ci});
    j.moveTo(x,y-(o.rise??12));j.pop();if(o.kick)j.punch(o.kick);
    const p={j,text,size:o.size??44,age:0,life:o.life??1.1,layers:o.layers};this.pops.push(p);return p}
  burst(x,y,n=6){for(let i=0;i<n;i++)this.coins.push({x,y,vx:(Math.random()*2-1)*260,vy:-420-Math.random()*520,ph:Math.random()*6,vp:10+Math.random()*14,r:10+Math.random()*4})}
  // coins that burst out, then home in on a target (the score) and pay out when they land
  fly(x,y,tx,ty,cb){const a=Math.random()*6.283,sp=180+Math.random()*260;
    this.coins.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-200,ph:Math.random()*6,vp:12+Math.random()*12,r:9+Math.random()*4,tx,ty,cb,age:0,fly:true})}
  shake(a=.3){if(cfg.shake)this.trauma=Math.min(1,this.trauma+a)}
  shakeOffset(max=18){const s=this.trauma*this.trauma*max;return{x:(Math.random()*2-1)*s,y:(Math.random()*2-1)*s}}
  update(rawDt,H=2000){
    const dt=Math.min(.05,rawDt)*cfg.timeScale,n=Math.ceil(dt*240)||1,d=dt/n;
    for(let i=0;i<n;i++){
      this.items.forEach(j=>j.update(d));
      this.pops.forEach(p=>{p.age+=d;if(p.age>p.life)p.j.hide();p.j.update(d)});
      this.coins.forEach(c=>{
        if(c.fly){if(c.done)return;c.age+=d;const k=40+c.age*c.age*2600,z=c.age<.12?1.5:9;
          c.vx+=(k*(c.tx-c.x)-z*c.vx)*d;c.vy+=(k*(c.ty-c.y)-z*c.vy)*d;c.x+=c.vx*d;c.y+=c.vy*d;c.ph+=c.vp*d;
          if((c.age>.18&&Math.hypot(c.tx-c.x,c.ty-c.y)<18)||c.age>1.6){c.done=true;c.cb&&c.cb()}}
        else{c.vy+=1500*d;c.x+=c.vx*d;c.y+=c.vy*d;c.ph+=c.vp*d}});
    }
    this.pops=this.pops.filter(p=>!(p.age>p.life&&p.j.s.x<.02&&p.j.sh.every(h=>h.s.x<.02)));
    this.coins=this.coins.filter(c=>c.fly?!c.done:c.y<H);
    this.trauma=Math.max(0,this.trauma-dt*1.6);
  }
  drawPops(ctx){this.pops.forEach(p=>{const L=cfg.layers;if(p.layers)cfg.layers=p.layers;drawSticker(ctx,p.j,p.text,p.size);cfg.layers=L})}
  drawCoins(ctx){ctx.lineWidth=2.5;ctx.strokeStyle=th.line;this.coins.forEach(p=>{const w=Math.abs(Math.cos(p.ph))*p.r+1.5;
    ctx.fillStyle=th.obj;ctx.beginPath();ctx.ellipse(p.x+3,p.y+3,w,p.r,0,0,7);ctx.fill();
    ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.ellipse(p.x,p.y,w,p.r,0,0,7);ctx.fill();ctx.stroke()})}
}
const fmt=n=>{n=Math.round(n);if(Math.abs(n)<1e6)return n.toLocaleString('en-US');const u=['K','M','B','T','Qa','Qi'];let i=-1;while(Math.abs(n)>=1000&&i<u.length-1){n/=1000;i++}return n.toFixed(n<10?2:n<100?1:0)+u[i]};
class CountUp{
  constructor(v=0){this.value=v;this.shown=v}
  add(n){this.value+=n}
  update(dt){this.shown+=(this.value-this.shown)*Math.min(1,dt*9);if(Math.abs(this.value-this.shown)<.5)this.shown=this.value}
  get text(){return fmt(this.shown)}
}

// ================= audio =================
let ac=null,sound=true,nb=null,lastHead=0;
function audio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}}if(ac&&ac.state==='suspended')ac.resume().catch(()=>{})}

function drawOffers(){

  if(!S.dice){const d=avail.find(p=>p.id==='d6');if(d)out.push(d)}
  while(out.length<3){const left=avail.filter(p=>!out.includes(p));if(!left.length)break;
    const wt=p=>RW[p.r]*(p.w||1);let t=left.reduce((a,p)=>a+wt(p),0)*Math.random();for(const p of left){t-=wt(p);if(t<=0){out.push(p);break}}}
  return out.sort(()=>Math.random()-.5);

const DIECOL={4:'#fff',6:'#fff',8:'#c9f2ff',10:'#d9ffcf',12:'#ffe0f0',20:'#fff2b8'};
function drawDie(d){
  const j=d.j,t=j.xf(),s=d.size,R=s*.58;if(t.s<.02)return;const step=cycleIndex(),a=J?Math.max(j.motion,d.hl,d.rolling?1:0):0,lw=Math.max(2,s*.06);
  if(cfg.shadow&&a>.02)for(let L=cfg.layers-1;L>=0;L--){const q=j.shadowXf(L,cfg.offset*s/40);ctx.save();ctx.globalAlpha=Math.min(1,a);ctx.translate(q.x,q.y);ctx.rotate(q.r+(d.rolling?d.spin*.8:0));ctx.scale(q.s,q.s);polyPath(ctx,d.sides,R);ctx.fillStyle=pal(step+j.ci+L*2);ctx.fill();ctx.lineWidth=lw;ctx.strokeStyle=th.line;ctx.stroke();ctx.restore()}
  ctx.save();ctx.translate(t.x,t.y);ctx.rotate(t.r+(d.rolling?d.spin:0));ctx.scale(t.s,t.s);
  ctx.save();ctx.translate(s*.1,s*.1);polyPath(ctx,d.sides,R);ctx.fillStyle=th.obj;ctx.fill();ctx.restore();
  polyPath(ctx,d.sides,R);ctx.fillStyle=DIECOL[d.sides];ctx.fill();ctx.lineWidth=lw;ctx.strokeStyle=th.line;ctx.stroke();
  const top=d.face===d.sides&&!d.rolling;
  if(d.sides===6){ctx.fillStyle=d.face===1?'#ff4b3e':'#111';for(const[px,py]of PIPS[d.face]){ctx.beginPath();ctx.arc(px*s*.26,py*s*.26,s*.085,0,7);ctx.fill()}}
  else{const txt=String(d.face);ctx.font=`${Math.round(s*(txt.length>1?.4:.5))}px "Archivo Black", Impact, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=top?'#ff4b3e':'#111';ctx.fillText(txt,0,d.sides===4?s*.12:s*.03)}
  ctx.restore();
  if(!d.rolling&&d.sides!==6){ctx.font='11px "Archivo Black", sans-serif';ctx.textAlign='center';ctx.fillStyle=th.hint;ctx.fillText('d'+d.sides,d.hx,d.hy+s*.78)}
}
function glyph(g,type,r){
  g.fillStyle='#111';g.strokeStyle='#111';g.textAlign='center';g.textBaseline='middle';
  const txt=(t,k)=>{g.font=`${Math.round(r*k)}px "Archivo Black", Impact, sans-serif`;g.fillText(t,0,r*.05)};
  if(!type||type==='plain'){const t=fmt(S.val);txt(t,t.length>2?.55:.85)}
  else if(type==='gold'){const t=fmt(S.val*5);txt(t,t.length>2?.5:.72)}
  else if(type==='lead')txt('1',.8);
  else if(type==='wild'){g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.24:r*.56;g.lineTo(Math.cos(a)*q,Math.sin(a)*q+r*.04)}g.closePath();g.fill()}
  else if(type==='ember'){g.beginPath();g.moveTo(0,-r*.56);g.quadraticCurveTo(r*.5,-r*.02,r*.32,r*.32);g.quadraticCurveTo(0,r*.62,-r*.32,r*.32);g.quadraticCurveTo(-r*.5,-r*.02,0,-r*.56);g.fill()}
  else if(type==='magnet'){const R_=r*.3;g.lineWidth=r*.2;g.lineCap='butt';g.beginPath();g.moveTo(-R_,-r*.42);g.lineTo(-R_,0);g.arc(0,0,R_,Math.PI,0,true);g.lineTo(R_,-r*.42);g.stroke()}
  else if(type==='crown'){g.beginPath();[[-.5,.32],[-.5,-.28],[-.25,.02],[0,-.44],[.25,.02],[.5,-.28],[.5,.32]].forEach(([x,y],i)=>i?g.lineTo(x*r,y*r):g.moveTo(x*r,y*r));g.closePath();g.fill()}
}
function drawCoin(c){
  const j=c.j,t=j.xf();if(t.s<.02)return;const r=c.r;let w=1,face=c.face||'h';
  if(c.flipping){const p0=Math.min(1,(T-c.t0)/c.dur),p=c.tease?1-Math.pow(1-p0,3):p0,ang=p*(c.spins||(c.res==='h'?6:7))*Math.PI,cs=Math.cos(ang);w=Math.abs(cs);face=cs>=0?'h':'t'}
  const typ=c.type||'plain',spec=typ!=='plain',gold=typ==='gold',ew=r*Math.max(.1,w),step=cycleIndex(),a=J?Math.max(j.motion,c.hl,c.flipping?.8:0,gold?.6:0):0,Hd=face==='h',lw=Math.max(2,r*.08);
  if(cfg.shadow&&a>.02)for(let L=(gold?2:cfg.layers)-1;L>=0;L--){const q=j.shadowXf(L,cfg.offset*r/30);ctx.save();ctx.globalAlpha=Math.min(1,a);ctx.translate(q.x,q.y);ctx.rotate(q.r);ctx.scale(q.s,q.s);ctx.fillStyle=pal(step+j.ci+L*2);ctx.beginPath();ctx.ellipse(0,0,ew,r,0,0,7);ctx.fill();ctx.lineWidth=lw;ctx.strokeStyle=th.line;ctx.stroke();ctx.restore()}
  ctx.save();ctx.translate(t.x,t.y);ctx.rotate(t.r);ctx.scale(t.s,t.s);if(tease&&c!==tease.c&&!tease.line.cs.includes(c))ctx.globalAlpha=.28;
  const dim=c.dim&&!c.flipping,blank=!c.face&&!c.flipping;
  ctx.fillStyle=th.obj;ctx.beginPath();ctx.ellipse(r*.1,r*.12,ew,r,0,0,7);ctx.fill();
  ctx.fillStyle=blank?th.blank:Hd?COINS[typ].col:dim?th.tails:th.mid;ctx.beginPath();ctx.ellipse(0,0,ew,r,0,0,7);ctx.fill();ctx.lineWidth=lw;ctx.strokeStyle=th.line;ctx.stroke();
  if(spec&&!Hd||spec&&blank){ctx.lineWidth=Math.max(3,r*.16);ctx.strokeStyle=COINS[typ].col;ctx.beginPath();ctx.ellipse(0,0,ew*.78,r*.78,0,0,7);ctx.stroke();ctx.strokeStyle=th.line}
  ctx.lineWidth=Math.max(1.5,r*.05);ctx.beginPath();ctx.ellipse(0,0,ew*.72,r*.72,0,0,7);ctx.stroke();
  if(w>.25){ctx.save();ctx.scale(w,1);ctx.fillStyle='#111';ctx.textAlign='center';ctx.textBaseline='middle';
    if(blank){if(spec){ctx.globalAlpha*=.55;glyph(ctx,typ,r*.8);ctx.globalAlpha/=.55}else{ctx.font=`${Math.round(r*.8)}px "Archivo Black", Impact, sans-serif`;ctx.fillText('?',0,r*.05)}}
    else if(Hd)glyph(ctx,typ,r);
    else{ctx.lineWidth=Math.max(2,r*.1);ctx.beginPath();ctx.moveTo(-r*.22,-r*.22);ctx.lineTo(r*.22,r*.22);ctx.moveTo(r*.22,-r*.22);ctx.lineTo(-r*.22,r*.22);ctx.stroke()}
    ctx.restore()}
  ctx.restore();
}
function drawBar(){
  const k=UI.k,g=need(),t=barJ.xf(),chip=Math.round(58*k),bw=Math.min(300*k,W-110),bh=Math.max(22,Math.round(26*k)),x0=-bw/2+chip/2+4,p=Math.min(1,score.shown/g),step=cycleIndex(),full=score.value>=g;
  ctx.save();ctx.translate(t.x,t.y);ctx.rotate(t.r);ctx.scale(t.s,t.s);
  const bx=-bw/2+chip+8,bW=bw-chip-8;
  ctx.fillStyle=th.hard;rr(ctx,-bw/2+4,-bh/2+4,chip,bh,7);ctx.fill();rr(ctx,bx+4,-bh/2+4,bW,bh,7);ctx.fill();
  ctx.fillStyle=J?pal(step+4):'#3ddc97';rr(ctx,-bw/2,-bh/2,chip,bh,7);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=th.line;ctx.stroke();
  ctx.fillStyle='#111';ctx.font=`${Math.max(12,Math.round(14*k))}px "Archivo Black", sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('LV '+S.lv,-bw/2+chip/2,1);
  ctx.fillStyle=th.tray;rr(ctx,bx,-bh/2,bW,bh,7);ctx.fill();
  ctx.save();rr(ctx,bx,-bh/2,bW,bh,7);ctx.clip();ctx.fillStyle=full&&J?pal(step):th.bar;ctx.fillRect(bx,-bh/2,bW*p,bh);
  if(amb()&&p>0){const ph=(tA%4)/1.3,sx=bx-30+ph*(bW*p+60);if(ph<=1){ctx.globalAlpha=.22;ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(sx,-bh/2);ctx.lineTo(sx+14,-bh/2);ctx.lineTo(sx+4,bh/2);ctx.lineTo(sx-10,bh/2);ctx.closePath();ctx.fill();ctx.globalAlpha=1}}
  ctx.restore();
  ctx.lineWidth=3;ctx.strokeStyle=th.edge;rr(ctx,bx,-bh/2,bW,bh,7);ctx.stroke();
  const txt=`${fmt(Math.min(score.shown,g))} / ${fmt(g)}`;ctx.lineJoin='round';
  if(skin==='dark'){ctx.lineWidth=4;ctx.strokeStyle='#0b0b0f';ctx.strokeText(txt,bx+bW/2,1)}ctx.fillStyle=th.ink;ctx.fillText(txt,bx+bW/2,1);
  ctx.restore();
}
function drawLines(){
  const step=cycleIndex(),seg=(l,w,col,dash)=>{const a=l.cs[0].j.xf(),b=l.cs[l.cs.length-1].j.xf();ctx.setLineDash(dash||[]);ctx.lineCap='round';
    ctx.lineWidth=w+6;ctx.strokeStyle=th.line;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    ctx.lineWidth=w;ctx.strokeStyle=col;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([])};
  ph.paid.forEach((p,i)=>{const k=Math.min(1,(T-p.t)/.22),l=p.l,a=l.cs[0],b=l.cs[l.cs.length-1];if(k<=0)return;
    const part={cs:[a,{j:{xf:()=>({x:a.tx+(b.tx-a.tx)*k,y:a.ty+(b.ty-a.ty)*k})}}]};
    ctx.save();ctx.globalAlpha=.9;seg(part,Math.max(8,a.r*.42),J?pal(step+i*3):'#ff5ca8');ctx.restore()});
  ph.miss.forEach(p=>{const age=T-p.t;if(age>1.2)return;ctx.save();ctx.globalAlpha=Math.max(0,1-age/1.2)*.8;seg(p.l,Math.max(5,p.l.cs[0].r*.25),'#ff4b3e',[2,14]);ctx.restore()});
}
function drawPips(){
  const cal=calibrating();if(cal){ctx.font='12px "Archivo Black", sans-serif';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillStyle=th.hint;ctx.fillText('FREE FLIPS',W/2,UI.pipY)}
  const n=cal?0:Math.max(budget(),S.left),sz=Math.round(12*Math.max(.85,UI.k)),gp=6,w=n*sz+(n-1)*gp,x0=W/2-w/2,y=UI.pipY;
  for(let i=0;i<n;i++){const on=cal?i<S.calib:i<S.left,x=x0+i*(sz+gp);if(amb()&&!cal&&i===S.left-1&&!busy){const k=1+Math.sin(tA*4)*.12;ctx.save();ctx.translate(x+sz/2,y+sz/2);ctx.scale(k,k);ctx.translate(-x-sz/2,-y-sz/2)}else ctx.save();ctx.fillStyle=th.hard;rr(ctx,x+2,y+2,sz,sz,3);ctx.fill();
    ctx.fillStyle=on?(cal?'#4cc9f0':S.left===1?'#ff4b3e':'#ffe14d'):th.tray;rr(ctx,x,y,sz,sz,3);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=on?th.line:th.edge;ctx.stroke();ctx.restore()}
  if(dice.length){ctx.font='12px "Archivo Black", sans-serif';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillStyle=th.hint;ctx.fillText(`SLOTS ${dice.length}/${S.slots}`,trayX+12,playTop+10)}
}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=th.bg;ctx.fillRect(0,0,W,H);
  // dot grid drifts slowly; a soft brightness wave rolls across it
  const A=amb(),ox=A?(tA*5)%24:0,oy=A?(tA*3)%48:0;ctx.fillStyle=th.dot;
  for(let y=12-48+oy;y<H;y+=24)for(let x=12-24+ox+((Math.round((y-oy)/24))%2)*12;x<W;x+=24){
    if(A)ctx.globalAlpha=.55+.45*Math.sin(x*.012+y*.009-tA*.7);ctx.fillRect(x,y,2,2)}
  ctx.globalAlpha=1;
  if(A){ctx.fillStyle=th.ink;motes.forEach(m=>{const x=m.x*W+Math.sin(tA*.5+m.ph)*14,y=((m.y*H-tA*m.v)%(H+20)+H+20)%(H+20)-10;
    ctx.globalAlpha=.07+.05*Math.sin(tA*1.3+m.ph);if(m.k){ctx.fillRect(x-m.r,y-.75,m.r*2,1.5);ctx.fillRect(x-.75,y-m.r,1.5,m.r*2)}else{ctx.beginPath();ctx.arc(x,y,m.r*.7,0,7);ctx.fill()}});ctx.globalAlpha=1}
  const o=world.shakeOffset();ctx.translate(o.x,o.y);
  const tsh=7+(amb()?Math.sin(tA*1.4)*1.6:0);ctx.fillStyle=th.hard;rr(ctx,trayX+tsh,playTop+tsh,trayW,playBot-playTop,14);ctx.fill();
  ctx.fillStyle=th.tray;rr(ctx,trayX,playTop,trayW,playBot-playTop,14);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=th.edge;ctx.stroke();
  if(!S.presses){ctx.fillStyle=th.hint;ctx.font='700 14px "Space Grotesk", sans-serif';ctx.textAlign='center';ctx.fillText('tap FLIP and watch it play out',W/2,playBot-24)}
  dice.forEach(drawDie);fading.forEach(drawCoin);coins.forEach(c=>{if(!tease||c!==tease.c)drawCoin(c)});drawLines();if(tease)drawCoin(tease.c);
  world.drawCoins(ctx);
  drawBar();drawPips();
  drawSticker(ctx,hudJ,score.text,Math.min(56*UI.k,W/7));
  world.drawPops(ctx);
}

// ================= loop =================
let last=performance.now();
function frame(now){
  const raw=Math.min(.05,(now-last)/1000);last=now;const dt=raw*cfg.timeScale;T+=dt;
  for(let guard=0;guard<8;guard++){const due=events.filter(e=>e.t<=T);if(!due.length)break;events=events.filter(e=>e.t>T);due.sort((a,b)=>a.t-b.t).forEach(e=>e.fn())}
  dice.forEach(d=>{if(d.rolling){const p=Math.min(1,(T-d.t0)/d.lt);d.spin=(d.spin||0)+dt*(1-p)*22;d.ft-=dt;if(d.ft<=0){d.ft=.04+p*p*.16;d.face=anyFace(d);sfx.tumble(p)}}else d.spin=0;d.hl=Math.max(0,d.hl-dt*1.8)});
  coins.forEach(c=>c.hl=Math.max(0,c.hl-dt*1.4));
  tA+=raw;
  if(amb()){
    hudJ.p.y.t=UI.hudY+Math.sin(tA*1.3)*2.2;hudJ.r.t=Math.sin(tA*.8)*.025;barJ.p.y.t=UI.barY+Math.sin(tA*1.3-.9)*1.4;
    dice.forEach((d,i)=>{if(!d.rolling&&Math.abs(d.j.p.x.x-d.hx)<6){d.j.p.y.t=d.hy+Math.sin(tA*1.7+i*1.3)*2.2;d.j.r.t=Math.sin(tA*1.05+i*.9)*.05}});
    coins.forEach((c,i)=>{if(!c.flipping&&!c.hidden&&!c.tease&&!(tease&&tease.c===c)&&!busy){c.j.p.y.t=c.ty+Math.sin(tA*2.1+i*.7)*1.6}});
  }else{hudJ.r.t=0;dice.forEach(d=>{if(!d.rolling)d.j.r.t=0})}
  world.update(raw,H+200);score.update(dt);
  fading=fading.filter(c=>{const gone=c.j.s.t===0&&c.j.s.x<.02;if(gone)world.items.delete(c.j);return!gone});
  // level-up: wait for the press and every flying coin to finish, then celebrate, then show cards
  if(!lvlOpen&&lvDelay<0&&!busy&&!world.coins.some(c=>c.fly)&&score.value>=need()){
    lvDelay=J?.55:.1;go.classList.remove('down');sfx.levelup();
    if(J){world.popText('LEVEL UP!',W/2,(coinTop+playBot)/2,{size:Math.min(68,W/6.5),layers:3,kick:10,life:.9});world.shake(.55)}
  }
  if(!lvlOpen&&lvDelay<0&&!over&&overDelay<0&&!busy&&!calibrating()&&S.left<=0&&!world.coins.some(c=>c.fly)&&score.value<need()){
    overDelay=.6;sfx.over();if(J){world.popText('OUT OF PRESSES',W/2,(coinTop+playBot)/2,{size:Math.min(46,W/9),layers:3,kick:8,life:1});world.shake(.5)}}
  if(overDelay>=0){overDelay-=raw;if(overDelay<0)openOver()}
  if(lvDelay>=0){lvDelay-=raw;if(lvDelay<0)openLevel()}
  refreshGo();
  draw();
  const ci=cycleIndex(),rs=document.documentElement.style;rs.setProperty('--pal',J?pal(ci):'#ffe14d');rs.setProperty('--pal2',J?pal(ci+3):'#4cc9f0');
  requestAnimationFrame(frame);
}

// ================= update check =================
// The live site carries version.json next to index.html. When it no longer matches the BUILD baked into this page,
// offer a reload (never mid-press). Polls every 2 minutes and whenever the tab comes back to the foreground.
const BUILD='20261126024432';let updShown=false,updDismissed='';
async function checkUpdate(){
  if(location.protocol==='file:')return;
  try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const v=await r.json();
    if(v&&v.build&&v.build!==BUILD&&v.build!==updDismissed){updShown=v.build;showUpd()}}catch(e){}
}
function showUpd(){if(busy||lvlOpen||over){setTimeout(showUpd,1500);return}$('#upd').classList.add('open');sfx.ping()}
$('#updGo').addEventListener('click',()=>{save();const u=new URL(location.href);u.searchParams.set('v',updShown||Date.now());location.replace(u.toString())});
$('#updLater').addEventListener('click',()=>{updDismissed=updShown;$('#upd').classList.remove('open')});
setTimeout(checkUpdate,4000);setInterval(checkUpdate,120000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});

// ================= input =================
// let one-shot animations finish, then hand back to the idle loop
go.addEventListener('animationend',e=>{if(e.animationName==='hit'||e.animationName==='ready')go.classList.remove('hit','ready')});
$('#pouchBtn').addEventListener('animationend',e=>{if(e.animationName==='hit')e.currentTarget.classList.remove('bump')});
cardsEl.addEventListener('animationend',e=>{const c=e.target.closest('.card');if(c&&e.animationName==='flipIn'){c.style.setProperty('--fd',(-Math.random()*3).toFixed(2)+'s');c.classList.add('idle')}});
function syncAmb(){document.documentElement.classList.toggle('amb',amb())}syncAmb();
go.addEventListener('pointerdown',e=>{e.preventDefault();go.classList.add('down');press()});
const release=()=>{go.classList.remove('down')};
['pointerup','pointerleave','pointercancel'].forEach(ev=>go.addEventListener(ev,release));
addEventListener('keydown',e=>{
  if(pouchDlg.classList.contains('open')){if(e.code==='Escape'||e.code==='KeyP')pouchDlg.classList.remove('open');return}
  if(e.code==='KeyP'&&!lvlOpen&&!over){openPouch();return}
  if(over){if(e.code==='Enter'||e.code==='Space'){e.preventDefault();newRun()}return}
  if(lvlOpen){const i={Digit1:0,Digit2:1,Digit3:2}[e.code];if(i!==undefined&&offersNow[i])pick(offersNow[i]);if(e.code==='KeyR')rerollBtn.click();return}
  if(e.code==='Space'||e.code==='Enter'){if(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#opt'))return;e.preventDefault();if(!e.repeat){go.classList.add('down');press()}}});
addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='Enter')release()});
addEventListener('blur',release);
const tog=(el,on)=>el.setAttribute('aria-pressed',on?'true':'false');
$('#optBtn').addEventListener('click',()=>{const p=$('#panel'),o=!p.classList.contains('open');p.classList.toggle('open',o);$('#optBtn').setAttribute('aria-expanded',o)});
$('#tJuice').addEventListener('click',e=>{J=!J;setTimeout(syncAmb);cfg.shadow=cfg.cycle=cfg.punch=J;cfg.shake=J&&!matchMedia('(prefers-reduced-motion: reduce)').matches;tog(e.currentTarget,J)});
$('#tSlow').addEventListener('click',e=>{cfg.timeScale=cfg.timeScale===1?.2:1;tog(e.currentTarget,cfg.timeScale!==1)});
$('#tSound').addEventListener('click',e=>{sound=!sound;tog(e.currentTarget,sound)});
function applySkin(){th=SKINS[skin];document.documentElement.dataset.skin=skin;$('#tSkin').setAttribute('aria-pressed',skin==='light'?'true':'false');try{localStorage.setItem('oddsEngine.skin',skin)}catch(e){}}
$('#tSkin').addEventListener('click',()=>{skin=skin==='dark'?'light':'dark';applySkin()});
applySkin();
let resetArm=0;
$('#tReset').addEventListener('click',e=>{const b=e.currentTarget;if(performance.now()-resetArm>2500){resetArm=performance.now();b.textContent='Tap again to reset';return}
  b.textContent='Reset save';resetArm=0;Object.assign(S,FRESH);S.sides=[];S.pouch=[...FRESH.pouch];bag=[];pouchBump();score.value=score.shown=0;world.coins=[];
  lvlOpen=false;lvDelay=-1;lvlEl.classList.remove('open');over=false;overDelay=-1;$('#over').classList.remove('open');
  S.sides=[];dice.forEach(d=>world.items.delete(d.j));dice=[];clearCoins();events=[];setBusy(false);save();layout();
  const s=coinSlots(1)[0];coins=[makeCoin(s.x,s.y,s,false)]});
addEventListener('resize',()=>layout());
layout(true);
if(!coins.length&&!dice.length){const s=coinSlots(1)[0];coins=[makeCoin(s.x,s.y,s,false)]}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>layout());
requestAnimationFrame(frame);
}
